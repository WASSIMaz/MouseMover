<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #ffffff;
  font-family: 'Times New Roman', Times, serif;
  color: #000000;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER — minimal academic ── */
#header {
  padding: 10px 20px 8px;
  border-bottom: 2px solid #000;
  display: flex;
  align-items: baseline;
  gap: 20px;
  flex-shrink: 0;
}
#header h1 {
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
#header span {
  font-size: 11px;
  color: #555;
  font-style: italic;
}

/* ── CANVAS ── */
#canvas-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: grab;
  background: #fff;
}
#canvas-wrap.grabbing { cursor: grabbing; }
#canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

/* ── TOOLTIP ── */
#tooltip {
  position: absolute;
  pointer-events: none;
  background: #fff;
  border: 1px solid #000;
  padding: 6px 10px;
  font-family: 'Times New Roman', serif;
  font-size: 11px;
  max-width: 260px;
  line-height: 1.5;
  z-index: 200;
  display: none;
  white-space: normal;
}

/* ── ZOOM ── */
#zoom-ctrl {
  position: absolute;
  bottom: 14px;
  right: 14px;
  display: flex;
  gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 26px; height: 26px;
  border: 1px solid #000;
  background: #fff;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Times New Roman', serif;
}
.zoom-btn:hover { background: #f0f0f0; }

/* ── LEGEND ── */
#legend {
  position: absolute;
  bottom: 14px;
  left: 14px;
  background: #fff;
  border: 1px solid #000;
  padding: 8px 12px;
  font-family: 'Times New Roman', serif;
  font-size: 10px;
  z-index: 50;
  line-height: 1.8;
}
#legend .leg-title {
  font-weight: bold;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  border-bottom: 1px solid #000;
  padding-bottom: 3px;
}
.leg-row { display: flex; align-items: center; gap: 8px; }
.leg-line { width: 28px; height: 1px; background: #000; flex-shrink: 0; }
.leg-line.dashed {
  background: none;
  border-top: 1px dashed #888;
}
.leg-line.thick { height: 2px; background: #000; }
.leg-box { width: 14px; height: 10px; border: 1px solid #000; flex-shrink: 0; }
.leg-box.filled { background: #e8e8e8; }
</style>
</head>

  { f:'toolfact',    t:'embmodel',      lb:'model load script', d:false },

  { f:'oraclefleet', t:'bus',           lb:'ChangeEvents + causal attribution', d:false },
  { f:'oraclefleet', t:'hot',           lb:'WorldModel update', d:false },

  // Watchdogs
  { f:'watchdogs',   t:'calluser',      lb:'CRITICAL / restart notify', d:false },
  { f:'watchdogs',   t:'typedbuf',      lb:'read ContextEnvelope', d:false },
  { f:'watchdogs',   t:'warm',          lb:'read checkpoint', d:false },
];

// ═══════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════

const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('canvas');
const wrap = document.getElementById('canvas-wrap');
const tooltip = document.getElementById('tooltip');

let scale = 1, tx = 20, ty = 20;
let isDragging = false, lastMX = 0, lastMY = 0;

const nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = n);

// Compute band actual y from band id
const bandMap = {};
BANDS.forEach(b => bandMap[b.id] = b);

// Adjust node absolute y to be relative to document (band.y + node.y offset within band)
NODES.forEach(n => {
  const b = bandMap[n.band];
  n.ay = b.y + (n.y - b.y);  // n.y is already absolute
});

// Total canvas height
const totalH = BANDS[BANDS.length-1].y + BANDS[BANDS.length-1].h + 30;

function makeSVGEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
  return el;
}

function applyTransform() {
  svg.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
  svg.setAttribute('width', CW);
  svg.setAttribute('height', totalH);
}

// ── Draw bands ──
function drawBands() {
  BANDS.forEach(b => {
    // Band background — alternating very subtle grey
    const rect = makeSVGEl('rect', {
      x: 0, y: b.y, width: CW, height: b.h,
      fill: (BANDS.indexOf(b) % 2 === 0) ? '#f7f7f7' : '#ffffff',
      stroke: '#000', 'stroke-width': 0.5
    });
    svg.appendChild(rect);

    // Band label (left side, rotated)
    const lbl = makeSVGEl('text', {
      x: 6, y: b.y + b.h/2,
      'font-family': 'Times New Roman, serif',
      'font-size': 8,
      'font-weight': 'bold',
      'letter-spacing': '0.12em',
      'text-anchor': 'middle',
      transform: `rotate(-90, 6, ${b.y + b.h/2})`,
      fill: '#555'
    });
    lbl.textContent = b.label;
    svg.appendChild(lbl);
  });
}

// ── Draw edges ──
function nodeCenter(id) {
  const n = nodeMap[id];
  if (!n) return null;
  return { x: n.x + n.w/2, y: n.y + n.h/2 };
}

function drawEdges() {
  // Arrow marker
  const defs = makeSVGEl('defs', {});
  const marker = makeSVGEl('marker', {
    id: 'arrow', markerWidth: 6, markerHeight: 6,
    refX: 5, refY: 3, orient: 'auto'
  });
  const arrowPath = makeSVGEl('path', {
    d: 'M0,0 L0,6 L6,3 z',
    fill: '#444'
  });
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svg.appendChild(defs);

  const markerDash = makeSVGEl('marker', {
    id: 'arrow-dash', markerWidth: 6, markerHeight: 6,
    refX: 5, refY: 3, orient: 'auto'
  });
  const arrowDashPath = makeSVGEl('path', {
    d: 'M0,0 L0,6 L6,3 z',
    fill: '#888'
  });
  markerDash.appendChild(arrowDashPath);
  defs.appendChild(markerDash);

  const edgeGroup = makeSVGEl('g', { id: 'edges' });

  EDGES.forEach(e => {
    const from = nodeMap[e.f];
    const to   = nodeMap[e.t];
    if (!from || !to) return;

    const fx = from.x + from.w/2;
    const fy = from.y + from.h/2;
    const tx2 = to.x + to.w/2;
    const ty2 = to.y + to.h/2;

    // Find edge exit/entry points (box boundary)
    const dx = tx2 - fx, dy = ty2 - fy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 1) return;
    const nx = dx/dist, ny = dy/dist;

    // Exit from source box
    const scaleX = from.w/2 / Math.abs(nx || 0.001);
    const scaleY = from.h/2 / Math.abs(ny || 0.001);
    const s = Math.min(scaleX, scaleY) * 0.95;
    const ex = fx + nx * s;
    const ey = fy + ny * s;

    // Entry to target box
    const scaleX2 = to.w/2 / Math.abs(nx || 0.001);
    const scaleY2 = to.h/2 / Math.abs(ny || 0.001);
    const s2 = Math.min(scaleX2, scaleY2) * 0.95;
    const enx = tx2 - nx * s2;
    const eny = ty2 - ny * s2;

    // Slight curve
    const cx = (ex + enx)/2 - dy * 0.08;
    const cy = (ey + eny)/2 + dx * 0.08;

    const path = makeSVGEl('path', {
      d: `M${ex},${ey} Q${cx},${cy} ${enx},${eny}`,
      fill: 'none',
      stroke: e.d ? '#999' : '#444',
      'stroke-width': e.d ? 0.7 : 1,
      'stroke-dasharray': e.d ? '4,3' : 'none',
      'marker-end': e.d ? 'url(#arrow-dash)' : 'url(#arrow)',
      opacity: 0.7
    });
    edgeGroup.appendChild(path);

    // Edge label — only at midpoint for non-trivial labels
    if (e.lb) {
      const mx = (ex + enx)/2 - dy * 0.05;
      const my = (ey + eny)/2 + dx * 0.05;
      const angle = Math.atan2(eny - ey, enx - ex) * 180 / Math.PI;
      const lbl = makeSVGEl('text', {
        x: mx, y: my - 3,
        'font-family': 'Times New Roman, serif',
        'font-size': 7,
        'text-anchor': 'middle',
        fill: e.d ? '#aaa' : '#666',
        transform: `rotate(${angle > 90 || angle < -90 ? angle + 180 : angle}, ${mx}, ${my})`,
      });
      lbl.textContent = e.lb;
      edgeGroup.appendChild(lbl);
    }
  });

  svg.appendChild(edgeGroup);
}

// ── Draw nodes ──
function drawNodes() {
  const nodeGroup = makeSVGEl('g', { id: 'nodes' });

  NODES.forEach(n => {
    // Determine style by band
    const isBusTb = (n.band === 'bus' || n.band === 'typedbuf');
    const isKernel = (n.band === 'kernel');
    const isSecurity = (n.band === 'security');
    const isStorage = (n.band === 'storage');
    const isInfra = (n.band === 'infra');

    let fillColor = '#fff';
    let strokeColor = '#000';
    let strokeW = 1;

    if (isBusTb) { fillColor = '#e0e0e0'; strokeW = 1.5; }
    else if (isKernel) { fillColor = '#fff'; strokeW = 1.5; }
    else if (isSecurity) { fillColor = '#efefef'; }
    else if (isStorage) { fillColor = '#f0f0f0'; strokeW = 0.8; }
    else if (isInfra) { fillColor = '#f0f0f0'; strokeW = 0.8; }
    else { fillColor = '#e8e8e8'; } // agents

    const g = makeSVGEl('g', { class: 'node', 'data-id': n.id, style: 'cursor:default' });

    const rect = makeSVGEl('rect', {
      x: n.x, y: n.y, width: n.w, height: n.h,
      rx: 2, ry: 2,
      fill: fillColor,
      stroke: strokeColor,
      'stroke-width': strokeW
    });
    g.appendChild(rect);

    // Label — multiline
    const lines = n.label.split('\n');
    const lineH = 11;
    const totalTextH = lines.length * lineH;
    const startY = n.y + n.h/2 - totalTextH/2 + 9;

    lines.forEach((line, i) => {
      const t = makeSVGEl('text', {
        x: n.x + n.w/2,
        y: startY + i * lineH,
        'font-family': 'Times New Roman, serif',
        'font-size': isBusTb ? 8 : 9,
        'font-weight': (i === 0 && !isBusTb) ? 'bold' : 'normal',
        'text-anchor': 'middle',
        fill: '#000'
      });
      // Truncate long single-line bus text
      const maxChars = isBusTb ? 200 : 30;
      t.textContent = line.length > maxChars ? line.slice(0, maxChars) + '…' : line;
      g.appendChild(t);
    });

    // Hover interaction
    g.addEventListener('mouseenter', (evt) => {
      rect.setAttribute('fill', '#fffde7');
      rect.setAttribute('stroke-width', strokeW + 1);
      showTooltip(n, evt);
    });
    g.addEventListener('mousemove', (evt) => {
      positionTooltip(evt);
    });
    g.addEventListener('mouseleave', () => {
      rect.setAttribute('fill', fillColor);
      rect.setAttribute('stroke-width', strokeW);
      hideTooltip();
    });

    nodeGroup.appendChild(g);
  });

  svg.appendChild(nodeGroup);
}

function showTooltip(n, evt) {
  tooltip.innerHTML = `<strong style="font-size:11px">${n.label.replace('\n',' ')}</strong><br><span style="font-size:10px;color:#333">${n.desc}</span>`;
  tooltip.style.display = 'block';
  positionTooltip(evt);
}

function positionTooltip(evt) {
  const wr = wrap.getBoundingClientRect();
  let lx = evt.clientX - wr.left + 14;
  let ly = evt.clientY - wr.top + 14;
  const tw = 270;
  if (lx + tw > wr.width - 10) lx = evt.clientX - wr.left - tw - 14;
  tooltip.style.left = lx + 'px';
  tooltip.style.top  = ly + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// ── Pan & Zoom ──
const canvasEl = wrap.querySelector('#canvas');

function setTransform() {
  canvasEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  canvasEl.style.transformOrigin = '0 0';
}

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.91;
  const wr = wrap.getBoundingClientRect();
  const mx = e.clientX - wr.left;
  const my = e.clientY - wr.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale *= factor;
  setTransform();
}, { passive: false });

wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  lastMX = e.clientX; lastMY = e.clientY;
  wrap.classList.add('grabbing');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx += e.clientX - lastMX;
  ty += e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  setTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  wrap.classList.remove('grabbing');
});

document.getElementById('btnZoomIn').onclick = () => { scale *= 1.15; setTransform(); };
document.getElementById('btnZoomOut').onclick = () => { scale *= 0.87; setTransform(); };
document.getElementById('btnFit').onclick = fitView;

function fitView() {
  const wr = wrap.getBoundingClientRect();
  const scaleX = (wr.width - 40) / CW;
  const scaleY = (wr.height - 40) / totalH;
  scale = Math.min(scaleX, scaleY);
  tx = (wr.width - CW * scale) / 2;
  ty = 10;
  setTransform();
}

// ── Build diagram ──
// Set SVG intrinsic size large (panned via CSS transform)
svg.setAttribute('width', CW);
svg.setAttribute('height', totalH);
svg.style.position = 'absolute';
svg.style.top = '0';
svg.style.left = '0';

drawBands();
drawEdges();
drawNodes();

// Initial fit
setTimeout(fitView, 50);
</script>
</body>
</html>
